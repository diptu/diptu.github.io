baseURL = 'https://diptu.github.io'
locale = 'en-us'
title = 'Nazmul Alam Diptu'
theme = 'PaperMod'

[pagination]
  pagerSize = 5
  path = 'page'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[params]
  author = 'Nazmul Alam Diptu'
  description = 'Nazmul Alam Diptu — working on efficient transformer inference and KV cache compression, transitioning into a PhD in theoretical machine learning.'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.profileMode]
  enabled = true
  title = 'Nazmul Alam'
  subtitle = """
  **Aspiring Researcher — Theoretical Machine Learning · Efficient Transformers · KV Cache Compression**
  """

[[params.profileMode.buttons]]
  name = '↓ Resume'
  url = '/resume.pdf'

